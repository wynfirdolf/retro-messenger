<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Retro Messenger</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--list-bg); }

  /* Oturum açma */
  #signin { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 26px 26px 14px; gap: 7px; overflow: auto; }
  #signin .brand { display: flex; align-items: center; gap: 8px; font: bold 20px/1 Tahoma, sans-serif; color: var(--heading); letter-spacing: -0.5px; margin-bottom: 10px; }
  #signin .brand small { display: block; font: 11px Tahoma, sans-serif; color: var(--muted); letter-spacing: 0; margin-top: 4px; }
  #signin .field { width: 100%; max-width: 230px; display: flex; flex-direction: column; gap: 3px; }
  #signin .field label { color: var(--ink-2); }
  #signin .xp-btn { margin-top: 10px; min-width: 110px; font-weight: bold; }
  #si-progress { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 14px; color: var(--heading); }
  #si-progress .ring { width: 54px; height: 54px; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .si-note { margin-top: auto; padding-top: 18px; color: var(--muted); text-align: center; word-break: break-all; }
  .si-note.bad { color: var(--error); }

  /* Ana liste */
  #main { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .me { display: flex; gap: 9px; padding: 10px 10px 8px; align-items: center; }
  .me .dp { cursor: pointer; }
  .me .who { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .me .name-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  #me-name { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #me-status { border: 0; background: none; padding: 0 2px; color: var(--ink-2); cursor: pointer; appearance: none; -webkit-appearance: none; field-sizing: content; }
  .name-row .caret { color: var(--muted); font-size: 9px; pointer-events: none; }
  #me-personal { border: 1px solid transparent; background: transparent; color: var(--muted); font-style: italic; width: 100%; padding: 2px 3px; }
  #me-personal:hover, #me-personal:focus { border-color: var(--line); background: var(--field); font-style: normal; }

  .usage { margin: 0 10px 6px; display: none; align-items: center; gap: 6px; color: var(--label); }
  .usage .bar { flex: 1; height: 11px; border: 1px solid var(--line); background: var(--field); padding: 1px; border-radius: 2px; }
  .usage .fill { height: 100%; background: repeating-linear-gradient(90deg, #37b532 0 7px, transparent 7px 9px); }

  .searchbar { display: flex; gap: 4px; padding: 5px 8px; background: var(--bar-bg); border-top: 1px solid var(--soft-line); border-bottom: 1px solid var(--soft-line); }
  #search { flex: 1; min-width: 0; }
  #add { min-width: 0; padding: 2px 8px; font-weight: bold; }

  #groups { flex: 1; overflow-y: auto; padding: 4px 0 8px; background: var(--surface); }
  .group-head { display: flex; align-items: center; gap: 5px; padding: 4px 8px; font-weight: bold; color: var(--heading); cursor: pointer; }
  .group-head .tri { width: 0; height: 0; border: 4px solid transparent; border-top: 5px solid var(--heading); margin-top: 4px; transition: transform 0.1s; }
  .group.closed .tri { transform: rotate(-90deg); margin-top: 0; }
  .group.closed .contact { display: none; }
  .contact { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 20px; cursor: default; border: 1px solid transparent; }
  .contact:hover { background: var(--hover); border-color: var(--hover-border); }
  .contact.sel { background: var(--sel); border-color: var(--sel-border); }
  .contact .cn { white-space: nowrap; color: var(--ink); }
  .contact .cm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-style: italic; }
  .contact.unread .cn { font-weight: bold; }
  .prov { flex: none; font-size: 9px; font-weight: bold; padding: 0 4px; border-radius: 6px; line-height: 14px; color: #fff; }
  .prov.codex { background: #10a37f; }
  .contact input { flex: 1; min-width: 0; padding: 1px 3px; }
  .empty { margin: 26px 18px; text-align: center; color: var(--muted); line-height: 1.6; }

  .bottom { flex: none; padding: 7px 10px; border-top: 1px solid var(--soft-line); background: var(--bar-bg); display: flex; flex-direction: column; gap: 6px; }
  .tip { display: flex; gap: 8px; align-items: center; padding: 6px 8px; min-height: 44px; border: 1px solid var(--tip-border); background: var(--tip-bg); color: var(--tip-ink); }
  .tip b { color: var(--tip-strong); }
  #newmenu {
    position: fixed; z-index: 60; width: 286px; padding: 0 0 4px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--dp-border); border-radius: 6px;
    box-shadow: 0 8px 24px #0005, 0 1px 3px #0003;
    animation: nmIn 0.12s ease-out;
  }
  #newmenu.up { transform-origin: bottom left; }
  #newmenu.down { transform-origin: top left; }
  @keyframes nmIn { from { opacity: 0; transform: scale(0.96); } }
  .nm-head {
    padding: 5px 10px; color: #fff; font-weight: bold; text-shadow: 1px 1px 0 #0a246a;
    background: linear-gradient(180deg, var(--title-hi), var(--title-1) 60%, var(--title-3));
  }
  .nm-item {
    display: flex; align-items: center; gap: 10px; width: calc(100% - 8px); margin: 4px 4px 0; padding: 7px 8px;
    border: 1px solid transparent; border-radius: 4px; background: none; text-align: left; cursor: default; color: var(--ink);
  }
  .nm-item:hover:not(.off), .nm-item:focus-visible { background: var(--sel); border-color: var(--sel-border); outline: none; }
  .nm-item.off { opacity: 0.5; }
  .nm-ico {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px; font-size: 20px;
    border-radius: 6px; border: 1px solid var(--dp-border); background: var(--dp-bg);
  }
  .nm-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nm-txt b { font-size: 12px; }
  .nm-txt small { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lang-pick { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
  .lang-pick select { border: 1px solid transparent; background: transparent; padding: 0 2px; color: var(--link); field-sizing: content; }
  .lang-pick select:hover { border-color: var(--line); background: var(--field); }
</style>
</head>
<body>
  <div class="titlebar"><span class="tb-icon"></span><span class="tb-title">Retro Messenger</span>
    <div class="tb-btns"><button data-win="min">_</button><button data-win="max">□</button><button data-win="close">×</button></div>
  </div>

  <section id="signin">
    <div class="brand"><span id="si-logo"></span><div>Retro Messenger<small data-i18n="signin.tagline"></small></div></div>
    <span id="si-avatar" data-i18n-title="signin.pictureTitle" style="cursor:pointer"></span>
    <button class="link" id="si-avatar-btn" data-i18n="signin.changePicture"></button>
    <div class="field"><label for="si-name" data-i18n="signin.name"></label><input type="text" id="si-name" maxlength="40" data-i18n-ph="signin.namePlaceholder"></div>
    <div class="field"><label for="si-status" data-i18n="signin.status"></label>
      <select id="si-status"><option value="online" data-i18n="status.online"></option><option value="busy" data-i18n="status.busy"></option><option value="away" data-i18n="status.away"></option><option value="hidden" data-i18n="status.hidden"></option></select>
    </div>
    <div class="field"><label for="si-lang" data-i18n="language"></label><select id="si-lang" class="lang-select"></select></div>
    <button class="xp-btn" id="si-go" data-i18n="signin.go"></button>
    <div id="si-progress"><svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="21" fill="none" stroke="#d6e4f7" stroke-width="6"/><path d="M27 6a21 21 0 0 1 21 21" fill="none" stroke="#2f7be6" stroke-width="6" stroke-linecap="round"/><path d="M27 48A21 21 0 0 1 6 27" fill="none" stroke="#4fcf3f" stroke-width="6" stroke-linecap="round"/></svg><span data-i18n="signin.progress"></span></div>
    <p class="si-note" id="si-note"></p>
  </section>

  <section id="main">
    <div class="me">
      <span id="me-avatar" data-i18n-title="list.changePicture"></span>
      <div class="who">
        <div class="name-row"><span id="me-name" data-i18n-title="list.signOutHint"></span><select id="me-status" data-i18n-title="list.changeStatus"></select><span class="caret">▼</span></div>
        <input type="text" id="me-personal" maxlength="80" data-i18n-ph="list.personal">
      </div>
    </div>
    <div class="usage" id="usage"><span id="usage-label" data-i18n="list.usage"></span><div class="bar"><div class="fill" id="usage-fill"></div></div><span id="usage-pct"></span></div>
    <div class="searchbar"><input type="text" id="search" data-i18n-ph="list.search"><button class="xp-btn" id="add" data-i18n-title="list.newChat">+ 👤</button></div>
    <div id="groups"></div>
    <div class="bottom">
      <div class="bottom-row"><button class="link" id="new-chat">👤 <span data-i18n="list.newChat"></span></button><label class="lang-pick">🌐 <select id="lang" class="lang-select" data-i18n-title="language"></select></label></div>
      <div class="bottom-row"><button class="link" id="import-chat">🕘 <span data-i18n="list.importChat"></span></button><label class="lang-pick">🌓 <select id="theme" data-i18n-title="theme.label"></select></label></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="list.js"></script>
</body>
</html>
