<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Retro Messenger</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--win-bg); }
  .wrap { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 10px; }

  /* Category list on the left, like the old Options dialog */
  nav {
    flex: none; width: 150px; display: flex; flex-direction: column; gap: 2px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
  }
  nav button {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 3px;
    background: none; text-align: left; color: var(--ink); cursor: default; font-size: 12px;
  }
  nav button .ico { font-size: 18px; width: 22px; text-align: center; }
  nav button:hover { background: var(--hover); border-color: var(--hover-border); }
  nav button.on { background: var(--sel); border-color: var(--sel-border); font-weight: bold; }

  main {
    flex: 1; min-width: 0; overflow-y: auto; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
  }
  h2 { margin: 0 0 12px; font-size: 14px; color: var(--heading); display: flex; align-items: center; gap: 8px; }
  fieldset { margin: 0 0 14px; padding: 8px 12px 12px; border: 1px solid var(--soft-line); border-radius: 4px; }
  legend { padding: 0 4px; color: var(--heading); font-weight: bold; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .row label.k { width: 120px; flex: none; color: var(--ink-2); }
  .row input[type="text"], .row select { flex: 1; min-width: 0; max-width: 260px; }
  .radio { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .radio label { display: flex; align-items: flex-start; gap: 7px; color: var(--ink); }
  .radio small { display: block; color: var(--muted); margin-top: 1px; }
  .chk { display: flex; align-items: center; gap: 7px; color: var(--ink); margin-top: 6px; }
  .hint { color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
  .me-dp { cursor: pointer; }
  .tools { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 6px; }
  .tools .ok { color: #2e9d3a; font-weight: bold; }
  .tools .no { color: var(--error); font-weight: bold; }
  .tools code { font: 11px Menlo, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .about { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
  .about b { font-size: 16px; color: var(--heading); display: block; }
  .foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 0 10px 10px; }
  section[data-page] { display: none; }
  section[data-page].on { display: block; }
</style>
</head>
<body>
  <div class="titlebar"><span class="tb-icon"></span><span class="tb-title"></span>
    <div class="tb-btns"><button data-win="close">×</button></div>
  </div>
  <div class="wrap">
    <nav id="nav">
      <button data-go="personal"><span class="ico">👤</span><span data-i18n="set.personal"></span></button>
      <button data-go="look"><span class="ico">🎨</span><span data-i18n="set.look"></span></button>
      <button data-go="messages"><span class="ico">💬</span><span data-i18n="set.messages"></span></button>
      <button data-go="about"><span class="ico">ℹ️</span><span data-i18n="set.about"></span></button>
    </nav>
    <main>
      <section data-page="personal">
        <h2>👤 <span data-i18n="set.personal"></span></h2>
        <fieldset>
          <legend data-i18n="set.profile"></legend>
          <div class="row"><span id="me-dp" class="me-dp" data-i18n-title="list.changePicture"></span><span class="hint" data-i18n="set.pictureHint"></span></div>
          <div class="row"><label class="k" for="name" data-i18n="signin.name"></label><input type="text" id="name" maxlength="40"></div>
          <div class="row"><label class="k" for="personal" data-i18n="set.personalMsg"></label><input type="text" id="personal" maxlength="80" data-i18n-ph="list.personal"></div>
          <div class="row"><label class="k" for="status" data-i18n="signin.status"></label><select id="status"></select></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="set.account"></legend>
          <p class="hint" data-i18n="set.signOutHint"></p>
          <div class="row"><button class="xp-btn" id="signout" data-i18n="set.signOut"></button></div>
        </fieldset>
      </section>

      <section data-page="look">
        <h2>🎨 <span data-i18n="set.look"></span></h2>
        <fieldset>
          <legend data-i18n="theme.label"></legend>
          <div class="radio" id="theme"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="set.language"></legend>
          <div class="row"><label class="k" for="lang" data-i18n="language"></label><select id="lang"></select></div>
        </fieldset>
      </section>

      <section data-page="messages">
        <h2>💬 <span data-i18n="set.messages"></span></h2>
        <fieldset>
          <legend data-i18n="links.label"></legend>
          <div class="radio" id="links"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="chat.font"></legend>
          <p class="hint" data-i18n="set.fontHint"></p>
        </fieldset>
      </section>

      <section data-page="about">
        <h2>ℹ️ <span data-i18n="set.about"></span></h2>
        <div class="about"><span id="logo"></span><div><b>Retro Messenger</b><span id="version" class="hint"></span></div></div>
        <fieldset>
          <legend data-i18n="set.tools"></legend>
          <div class="tools" id="tools"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="upd.title"></legend>
          <label class="chk"><input type="checkbox" id="autoupdate"><span data-i18n="upd.auto"></span></label>
          <div class="row"><span id="upd-status" class="hint"></span></div>
          <div class="row"><button class="xp-btn" id="upd-btn"></button></div>
        </fieldset>
        <div class="row"><button class="link" id="github">GitHub: wynfirdolf/retro-messenger</button></div>
      </section>
    </main>
  </div>
  <div class="foot"><button class="xp-btn" id="close" data-i18n="set.close"></button></div>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
