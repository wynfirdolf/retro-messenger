<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Sohbet</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: linear-gradient(180deg, #e3edf9 0, #c9daf1 100%); }
  body.shake .frame { animation: shake 0.5s linear; }
  @keyframes shake {
    10%, 50%, 90% { transform: translate(-6px, 2px); }
    30%, 70% { transform: translate(6px, -2px); }
  }

  .toolbar { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-bottom: 1px solid #a9c0e4; background: linear-gradient(180deg, #f6f9fe, #dbe7f7); flex-wrap: wrap; }
  .toolbar .sep { width: 1px; height: 22px; background: #a9c0e4; margin: 0 4px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; color: #333; }
  .toolbar select { padding: 1px 2px; }

  .to { flex: none; padding: 5px 10px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .to b { color: #000; }
  .to .path { color: var(--muted); }

  .frame { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px 8px; }
  .convo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

  #history {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    background: #fff; border: 1px solid #7f9db9; border-radius: 3px;
    font: 13px/1.45 var(--chat-font); user-select: text; -webkit-user-select: text;
  }
  .msg { margin: 0 0 9px; }
  .msg .who { color: #6b6b6b; font-size: 12px; }
  .msg .who .t { color: #a0a0a0; font-size: 11px; }
  .msg .text { padding-left: 12px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.claude .text { color: #102a6b; }
  .msg.me .text { color: #111; }
  .msg.live .text::after { content: '▍'; color: #7aa3e6; animation: blink 0.8s steps(2, start) infinite; }
  .msg code { font: 12px Menlo, Consolas, monospace; background: #f1f4f9; border: 1px solid #dde4ef; border-radius: 2px; padding: 0 3px; }
  .msg pre.code { font: 12px/1.4 Menlo, Consolas, monospace; background: #f6f8fb; border: 1px solid #d5ddea; border-left: 3px solid #6a9be6; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; overflow-x: auto; color: #222; }
  .line { margin: 2px 0 7px; color: #777; font-size: 12px; display: flex; gap: 6px; }
  .line.tool { color: #5e6f8c; }
  .line.tool + .line.tool { margin-top: -5px; }
  .line.error { color: #b3261e; white-space: pre-wrap; }
  .line .bullet { flex: none; }
  .day { text-align: center; color: #9a9a9a; font-size: 11px; margin: 4px 0 10px; }
  .welcome { color: #6b6b6b; font-size: 12px; border-bottom: 1px dotted #c8d3e3; padding-bottom: 8px; margin-bottom: 10px; }

  .compose-tools { flex: none; display: flex; align-items: center; gap: 2px; }
  .compose-tools .spacer { flex: 1; }
  .compose { flex: none; display: flex; gap: 6px; height: 92px; }
  #input { flex: 1; resize: none; font: 13px/1.4 var(--chat-font); padding: 6px 8px; border-radius: 3px; user-select: text; -webkit-user-select: text; }
  .compose .btns { display: flex; flex-direction: column; gap: 6px; width: 78px; }
  .compose .btns .xp-btn { flex: 1; min-width: 0; padding: 0; }
  #send { font-weight: bold; }

  .side { flex: none; width: 116px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding-top: 2px; }
  .side .who-label { margin-top: 4px; color: #4a5d7e; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .slot { display: flex; flex-direction: column; align-items: center; }
  #dp-claude { cursor: pointer; }

  .statusbar { flex: none; padding: 3px 8px; border-top: 1px solid #a9c0e4; background: linear-gradient(180deg, #eef3fb, #d9e6f7); color: #444; display: flex; align-items: center; gap: 6px; min-height: 22px; }
  .statusbar .typing { color: #1d3f84; }

  @media (max-width: 560px) { .side { display: none; } }
</style>
</head>
<body>
  <div class="titlebar"><span class="tb-icon"></span><span class="tb-title">Sohbet</span>
    <div class="tb-btns"><button data-win="min" title="Simge durumuna küçült">_</button><button data-win="max" title="Ekranı kapla">□</button><button data-win="close" title="Kapat">×</button></div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="btn-folder" title="Proje klasörünü aç"><span class="ico">📁</span>Klasör</button>
    <button class="tool-btn" id="btn-new" title="Önceki konuşmayı unutup yeni bir oturum başlat"><span class="ico">✨</span>Yeni oturum</button>
    <span class="sep"></span>
    <label>Model:
      <select id="model">
        <option value="">Varsayılan</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku">Haiku</option>
      </select>
    </label>
    <label title="Claude'un sormadan neler yapabileceği">Yetki:
      <select id="perm">
        <option value="default">Yalnızca okuma</option>
        <option value="plan">Plan modu</option>
        <option value="acceptEdits">Dosya düzenleyebilir</option>
        <option value="bypassPermissions">Tam yetki (dikkat)</option>
      </select>
    </label>
  </div>

  <div class="to">Kime: <b id="to-name"></b> <span class="path">&lt;<span id="to-cwd"></span>&gt;</span></div>

  <div class="frame">
    <div class="convo">
      <div id="history"></div>
      <div class="compose-tools">
        <button class="tool-btn" id="btn-emo" title="İfade seçin"><span class="ico">😊</span></button>
        <button class="tool-btn" id="btn-nudge" title="Titreşim gönder">
          <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><path d="M1 8h3l2-6 3 12 3-10 2 4h3" fill="none" stroke="#d04020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Titreşim
        </button>
        <span class="spacer"></span>
        <span id="hint" style="color:#7a8aa6">Enter: gönder · Shift+Enter: yeni satır</span>
      </div>
      <div class="compose">
        <textarea id="input" placeholder="Bir ileti yazın…"></textarea>
        <div class="btns">
          <button class="xp-btn" id="send">Gönder</button>
          <button class="xp-btn" id="stop" disabled>Durdur</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="slot"><span id="dp-claude" title="Bu sohbetin resmini değiştirin"></span><div class="who-label" id="lbl-claude"></div></div>
      <div class="slot"><span id="dp-me"></span><div class="who-label" id="lbl-me"></div></div>
    </div>
  </div>

  <div class="statusbar" id="status"></div>

  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
