<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:">
<title>Sohbet</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body { background: var(--win-bg); }
  body.shake .frame { animation: shake 0.5s linear; }
  @keyframes shake {
    10%, 50%, 90% { transform: translate(-6px, 2px); }
    30%, 70% { transform: translate(6px, -2px); }
  }

  .toolbar { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--soft-line); background: var(--bar-bg); flex-wrap: wrap; }
  .toolbar .sep { width: 1px; height: 22px; background: var(--soft-line); margin: 0 4px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; color: var(--ink-2); }
  .toolbar select { padding: 1px 2px; }

  .to { flex: none; padding: 5px 10px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .to b { color: var(--ink); }
  .to .path { color: var(--muted); }

  .frame { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px 8px; }
  .convo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

  #history {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
    font: 13px/1.45 var(--chat-font); user-select: text; -webkit-user-select: text;
  }
  .msg { margin: 0 0 9px; }
  .msg .who { color: var(--muted); font-size: 12px; }
  .msg .who .t { color: var(--faint); font-size: 11px; }
  .msg .text { padding-left: 12px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.claude .text { color: var(--claude-ink); }
  .msg.me .text { color: var(--ink); }
  .msg.live .text::after { content: '▍'; color: #7aa3e6; animation: blink 0.8s steps(2, start) infinite; }
  .msg code { font: 12px Menlo, Consolas, monospace; background: var(--code-inline); border: 1px solid var(--code-border); border-radius: 2px; padding: 0 3px; }
  .msg pre.code { font: 12px/1.4 Menlo, Consolas, monospace; background: var(--code-bg); border: 1px solid var(--code-border); border-left: 3px solid #6a9be6; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; overflow-x: auto; color: var(--code-ink); }
  .line { margin: 2px 0 7px; color: var(--muted); font-size: 12px; display: flex; gap: 6px; }
  .line.tool { color: var(--tool-ink); }
  .line.tool + .line.tool { margin-top: -5px; }
  .line.error { color: var(--error); white-space: pre-wrap; }
  .line .bullet { flex: none; }
  .day { text-align: center; color: var(--faint); font-size: 11px; margin: 4px 0 10px; }
  .welcome { color: var(--muted); font-size: 12px; border-bottom: 1px dotted var(--soft-line); padding-bottom: 8px; margin-bottom: 10px; }

  .compose-tools { flex: none; display: flex; align-items: center; gap: 2px; }
  .compose-tools .spacer { flex: 1; }
  .compose { flex: none; display: flex; gap: 6px; height: 92px; }
  #input { flex: 1; resize: none; font: 13px/1.4 var(--chat-font); padding: 6px 8px; border-radius: 3px; user-select: text; -webkit-user-select: text; }
  .compose .btns { display: flex; flex-direction: column; gap: 6px; width: 78px; }
  .compose .btns .xp-btn { flex: 1; min-width: 0; padding: 0; }
  #send { font-weight: bold; }

  .side { flex: none; width: 116px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding-top: 2px; }
  .side .who-label { margin-top: 4px; color: var(--label); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .slot { display: flex; flex-direction: column; align-items: center; }
  #dp-claude { cursor: pointer; }

  .statusbar { flex: none; padding: 3px 8px; border-top: 1px solid var(--soft-line); background: var(--bar-bg); color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-height: 22px; }
  .statusbar .typing { color: var(--heading); }
  #hint { color: var(--label); }

  .perm {
    margin: 4px 0 10px; padding: 8px 10px; border: 1px solid var(--tip-border); border-radius: 4px;
    background: var(--tip-bg); color: var(--tip-ink); font: 12px/1.45 var(--ui-font); user-select: none; -webkit-user-select: none;
    animation: permIn 0.25s ease-out;
  }
  @keyframes permIn { from { opacity: 0; transform: translateY(6px); } }
  .perm .head { display: flex; align-items: center; gap: 6px; font-weight: bold; color: var(--tip-strong); font-size: 12px; }
  .perm .what { margin: 4px 0 2px; font-weight: bold; color: var(--ink); }
  .perm .desc { font-style: italic; margin-bottom: 4px; }
  .perm pre.code { max-height: 180px; overflow: auto; user-select: text; -webkit-user-select: text; }
  .perm .plan { max-height: 220px; overflow: auto; padding: 6px 8px; background: var(--surface); border: 1px solid var(--code-border); color: var(--ink); user-select: text; -webkit-user-select: text; }
  .perm .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .perm .btns .allow { font-weight: bold; }
  .statusbar .waiting { color: var(--error); font-weight: bold; }
  .files { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin-top: 4px; padding-left: 12px; }
  .fchip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 8px 4px 6px;
    border: 1px solid var(--soft-line); border-radius: 4px; background: var(--bar-bg); color: var(--ink);
    font: 11px var(--ui-font); cursor: pointer; text-align: left;
  }
  .fchip:hover { border-color: var(--sel-border); }
  .fchip .fi { font-size: 18px; line-height: 1; flex: none; }
  .fchip .fn { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fchip .fs { color: var(--muted); white-space: nowrap; flex: none; }
  .fchip.missing { opacity: 0.55; cursor: default; }
  .thumb { display: block; max-width: 220px; max-height: 160px; border: 1px solid var(--soft-line); border-radius: 4px; cursor: pointer; background: var(--surface); }
  #tray { display: none; flex-wrap: wrap; gap: 6px; }
  #tray.has { display: flex; }
  #tray .fchip { cursor: default; padding-right: 4px; }
  #tray .fchip img { width: 28px; height: 28px; object-fit: cover; border-radius: 3px; flex: none; }
  #tray .rm { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 4px; cursor: pointer; }
  #tray .rm:hover { color: var(--error); }
  #drop {
    position: fixed; inset: 30px 0 0; display: none; place-items: center; z-index: 40;
    background: color-mix(in srgb, var(--title-2) 22%, transparent); border: 3px dashed var(--title-2);
    font: bold 16px var(--ui-font); color: var(--heading); pointer-events: none;
  }
  body.dragging #drop { display: grid; }
  #drop span { padding: 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px #0004; }
  .fontpop { width: 330px; }
  .fontpop .fonts { height: 176px; overflow-y: auto; border: 1px solid var(--line); background: var(--field); margin-bottom: 8px; }
  .fontpop .fonts .grp { padding: 3px 6px; font-weight: bold; color: var(--label); background: var(--bar-bg); position: sticky; top: 0; }
  .fontpop .fonts button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; font-size: 14px; color: var(--ink); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fontpop .fonts button:hover { background: var(--hover); }
  .fontpop .fonts button.on { background: var(--sel); }
  .fontpop .row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .fontpop .tog { width: 28px; height: 26px; padding: 0; min-width: 0; font: 14px Georgia, serif; }
  .fontpop .tog.on { background: var(--sel); border-color: var(--sel-border); }
  .fontpop .sw { width: 20px; height: 20px; border: 1px solid #0005; border-radius: 3px; padding: 0; cursor: default; }
  .fontpop .sw.on { outline: 2px solid var(--heading); outline-offset: 1px; }
  .fontpop .sw.auto { background: linear-gradient(135deg, var(--surface) 50%, var(--ink) 50%); }
  .fontpop input[type="color"] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  .fontpop .preview { padding: 8px; border: 1px dashed var(--line); background: var(--surface); font: 13px var(--chat-font); min-height: 38px; overflow: hidden; }
  @media (max-width: 560px) { .side { display: none; } }
</style>
</head>
<body>
  <div class="titlebar"><span class="tb-icon"></span><span class="tb-title"></span>
    <div class="tb-btns"><button data-win="min">_</button><button data-win="max">□</button><button data-win="close">×</button></div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="btn-folder" data-i18n-title="chat.folderTitle"><span class="ico">📁</span><span data-i18n="chat.folder"></span></button>
    <button class="tool-btn" id="btn-new" data-i18n-title="chat.newSessionTitle"><span class="ico">✨</span><span data-i18n="chat.newSession"></span></button>
    <span class="sep"></span>
    <label data-i18n-title="chat.modelTitle"><span data-i18n="chat.model"></span>
      <select id="family"></select>
      <select id="version" data-i18n-title="chat.version"></select>
    </label>
    <label data-i18n-title="chat.effortTitle"><span data-i18n="chat.effort"></span>
      <select id="effort"></select>
    </label>
    <label data-i18n-title="chat.permTitle"><span data-i18n="chat.perm"></span>
      <select id="perm">
        <option value="manual" data-i18n="perm.manual"></option>
        <option value="plan" data-i18n="perm.plan"></option>
        <option value="acceptEdits" data-i18n="perm.acceptEdits"></option>
        <option value="bypassPermissions" data-i18n="perm.bypassPermissions"></option>
      </select>
    </label>
  </div>

  <div class="to"><span data-i18n="chat.to"></span> <b id="to-name"></b> <span class="path">&lt;<span id="to-cwd"></span>&gt;</span></div>

  <div class="frame">
    <div class="convo">
      <div id="history"></div>
      <div class="compose-tools">
        <button class="tool-btn" id="btn-font" data-i18n-title="chat.fontTitle"><span class="ico" style="font:bold 15px Georgia,serif">A</span><span data-i18n="chat.font"></span></button>
        <button class="tool-btn" id="btn-emo" data-i18n-title="chat.emoTitle"><span class="ico">😊</span></button>
        <button class="tool-btn" id="btn-file" data-i18n-title="file.sendTitle"><span class="ico">📎</span><span data-i18n="file.send"></span></button>
        <button class="tool-btn" id="btn-nudge" data-i18n-title="chat.nudgeTitle">
          <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><path d="M1 8h3l2-6 3 12 3-10 2 4h3" fill="none" stroke="#d04020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span data-i18n="chat.nudge"></span>
        </button>
        <span class="spacer"></span>
        <span id="hint" data-i18n="chat.hint"></span>
      </div>
      <div id="tray"></div>
      <div class="compose">
        <textarea id="input" data-i18n-ph="chat.placeholder"></textarea>
        <div class="btns">
          <button class="xp-btn" id="send" data-i18n="chat.send"></button>
          <button class="xp-btn" id="stop" data-i18n="chat.stop" disabled></button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="slot"><span id="dp-claude" data-i18n-title="chat.changePicture"></span><div class="who-label" id="lbl-claude"></div></div>
      <div class="slot"><span id="dp-me"></span><div class="who-label" id="lbl-me"></div></div>
    </div>
  </div>

  <div class="statusbar" id="status"></div>
  <div id="drop"><span id="drop-text"></span></div>

  <script src="i18n.js"></script>
  <script src="models.js"></script>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
